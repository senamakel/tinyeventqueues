[package]
name = "tinyeventqueues"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "External event management and queuing: durably queues noisy inbound events and filters them before they reach an agent, as a TinyBus module over tinystoragedrivers."
documentation = "https://docs.rs/tinyeventqueues"
readme = "../../README.md"
keywords = ["tinybus", "events", "queue", "filtering", "agents"]
categories = ["asynchronous"]
publish = false

[lib]
# Keep the ordinary Rust library for tests and downstream reuse while also
# producing the native module artifact that TinyBus loads at runtime.
crate-type = ["rlib", "cdylib"]

[dependencies]
# The wire contract: the envelope, member names, payloads, outcomes and the
# pipeline configuration. Re-exported wholesale from `src/lib.rs`.
tinyeventqueues-bus = { workspace = true, features = ["storage"] }
# Storage ports and value types; concrete engines belong to the host.
tinystoragedrivers-api = { workspace = true }
tinystoragedrivers-types = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
data-encoding = { workspace = true }
tinybus = { workspace = true }
tinybus-module = { workspace = true }
thiserror = { workspace = true }
# The loaded module reaches the host's storage over the storage bus.
tinystoragedrivers-busproxy = { workspace = true }
# The module-owned pass timer and its wake-up signal.
tokio = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
# Real in-memory engines and shared queue conformance checks, for tests only.
tinystoragedrivers-testkit = { version = "2.1.2", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "c447da319e41dfe17bba4afb1831fe0cf0eef154" }
# Deterministic queue-clock tests use the v2 memory engine with the pipeline
# ManualClock; production still receives QueueStore only from the host.
tinystoragedrivers-queue = { version = "2.1.2", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "c447da319e41dfe17bba4afb1831fe0cf0eef154" }
# The public-API test implements the `Host` trait as a downstream host does.
async-trait = { workspace = true }
# The release verifier passes an explicit empty module configuration, and the
# tests build JSON fixtures.
serde_json = { workspace = true }
# Tests serve the storage objects on the in-memory broker the module connects
# to, and use the broker test support.
tinybus = { workspace = true, features = ["test-support"] }

[features]
default = []
# Link this adapter into a host binary (a host's `linked` module source)
# without exporting the shared C names; exposes `linked_module()` instead.
static-link = []
linked = ["static-link"]

[lints]
workspace = true
